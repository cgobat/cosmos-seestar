name: Build and Publish Ruby Gem

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Build with Rake
        run: |
          cd ${{ github.workspace }}/openc3-cosmos-seestar
          GEM_VERSION="0.0.0.$(date -u +%Y%m%d%H%M%S)"
          echo "GEM_VERSION=$GEM_VERSION" >> $GITHUB_ENV
          VERSION=$GEM_VERSION bundle exec rake build
          pwd
          ls -l
