name: Build/Publish Ruby Gem

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: false

      - name: Set up registry credentials
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: Bearer ${GITHUB_TOKEN}\n" > $HOME/.gem/credentials

      - name: Rake build
        run: |
          cd ${{ github.workspace }}/openc3-cosmos-seestar
          GEM_VERSION="0.0.0.$(date -u +%Y%m%d%H%M%S)"
          echo "GEM_VERSION=$GEM_VERSION" >> $GITHUB_ENV
          VERSION=$GEM_VERSION rake build
          echo "Built gem version $GEM_VERSION"
          ls -l *.gem

      - name: Publish gem to GitHub
        run: |
          cd ${{ github.workspace }}/openc3-cosmos-seestar
          gem push --KEY github --host https://rubygems.pkg.github.com/${{ github.repository_owner }} openc3-cosmos-seestar-$GEM_VERSION.gem
